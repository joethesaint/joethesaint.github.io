name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install 🔧
        run: npm ci

      - name: Build viewer controls
        run: npm ci --prefix biogas-ui && npm --prefix biogas-ui run build:effects

      - name: Type-check ✅
        run: npm run check

      - name: Lint 🔎
        run: npm run lint

      - name: Build 🏗️
        run: npm run build

      - name: Biogas model and state checks
        run: npm run test:biogas

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser and shader checks
        run: npm run test:browser
        env:
          CI: true

      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: biogas-browser-evidence
          path: |
            test-results/
            playwright-report/

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
